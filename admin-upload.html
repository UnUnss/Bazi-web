<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>壁纸上传管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f4; color: #1c1c1c; min-height: 100vh; }

/* ── 登录 ── */
#loginSection { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-card { background: #fff; border-radius: 8px; padding: 40px; width: 360px; box-shadow: 0 1px 12px rgba(0,0,0,.08); }
.login-card h1 { font-size: 17px; font-weight: 600; margin-bottom: 28px; letter-spacing: .04em; }
.form-row { margin-bottom: 14px; }
.form-row label { display: block; font-size: 12px; color: #777; margin-bottom: 6px; letter-spacing: .04em; }
.form-row input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; outline: none; transition: border-color .15s; }
.form-row input:focus { border-color: #555; }
.btn-primary { width: 100%; padding: 11px; background: #1c1c1c; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; letter-spacing: .04em; }
.btn-primary:disabled { opacity: .45; cursor: default; }
.btn-outline { width: 100%; padding: 10px; background: #fff; color: #1c1c1c; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; cursor: pointer; margin-top: 8px; }
.login-msg { font-size: 12px; color: #d44; margin-top: 10px; min-height: 16px; }
.login-ok  { color: #2a7; }

/* ── 主区域 ── */
#mainSection { display: none; }
.header { background: #fff; border-bottom: 1px solid #eee; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 52px; }
.header h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; }
.header-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #888; }
.btn-sm { padding: 6px 14px; font-size: 12px; background: #fff; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; color: #444; }

/* 标签页 */
.tabs { display: flex; gap: 0; border-bottom: 1px solid #e8e8e6; background: #fff; padding: 0 32px; }
.tab { padding: 12px 0; margin-right: 28px; font-size: 13px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; letter-spacing: .04em; }
.tab.active { color: #1c1c1c; border-bottom-color: #1c1c1c; }

.tab-content { display: none; padding: 28px 32px 80px; max-width: 1200px; margin: 0 auto; }
.tab-content.active { display: block; }

/* ── 上传标签页 ── */
.drop-zone { border: 1.5px dashed #ccc; border-radius: 8px; padding: 48px 24px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; margin-bottom: 24px; }
.drop-zone.drag-over { border-color: #555; background: #fafaf9; }
.drop-zone svg { color: #ccc; margin-bottom: 10px; }
.drop-zone p { color: #999; font-size: 13px; }
.drop-zone p.hint { font-size: 11px; margin-top: 4px; color: #bbb; }
.drop-zone input[type=file] { display: none; }

#unknownWrap { display: none; background: #fff8e6; border: 1px solid #f0d090; border-radius: 6px; padding: 10px 14px; margin-bottom: 16px; font-size: 12px; color: #a06010; }

/* 队列卡片网格 */
#queueSection { display: none; }
.queue-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.queue-toolbar span { font-size: 13px; color: #888; }
#btnUpload { padding: 9px 28px; background: #1c1c1c; color: #fff; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; }
#btnUpload:disabled { opacity: .4; cursor: default; }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.wp-card { background: #fff; border-radius: 6px; overflow: hidden; border: 1px solid #eee; }
.wp-card .thumb { width: 100%; aspect-ratio: 9/16; object-fit: cover; background: #f0f0ee; display: block; }
.wp-card .thumb-placeholder { width: 100%; aspect-ratio: 9/16; background: #f5f5f3; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 11px; }
.wp-card .card-info { padding: 8px 10px; }
.wp-card .card-name { font-size: 11px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 6px; }
.wp-card .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.wp-card .card-status { font-size: 11px; }
.card-status.pending   { color: #aaa; }
.card-status.uploading { color: #2563eb; }
.card-status.done      { color: #16a34a; }
.card-status.error     { color: #dc2626; }

/* ── 管理标签页 ── */
.manage-toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.manage-filters { display: flex; gap: 10px; flex-wrap: wrap; }
.manage-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn-regen { padding: 6px 14px; font-size: 12px; background: #1c1c1c; color: #fff; border: 1px solid #1c1c1c; border-radius: 4px; cursor: pointer; letter-spacing: .04em; }
.btn-regen.btn-check { background: #fff; color: #1c1c1c; }
.btn-regen:disabled { opacity: .45; cursor: default; }
#previewTestOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:9999; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
#previewTestOverlay.show { display:flex; }
#previewTestOverlay img { max-width:min(360px,90vw); max-height:70vh; border-radius:8px; box-shadow:0 4px 24px rgba(0,0,0,.5); }
#previewTestOverlay p { color:#fff; font-size:13px; text-align:center; max-width:360px; word-break:break-all; }
#previewTestOverlay button { padding:8px 24px; background:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
.filter-btn { padding: 5px 14px; border-radius: 20px; font-size: 12px; border: 1px solid #ddd; background: #fff; cursor: pointer; color: #555; }
.filter-btn.active { background: #1c1c1c; color: #fff; border-color: #1c1c1c; }
#managedGrid .wp-card .thumb { cursor: default; }
.empty-hint { color: #bbb; font-size: 13px; text-align: center; padding: 60px 0; }

/* 按文件夹编号分组 */
.folder-groups { display: flex; flex-direction: column; gap: 28px; }
.folder-group-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e8e8e6; flex-wrap: wrap; }
.folder-group-title { font-size: 14px; font-weight: 600; color: #1c1c1c; letter-spacing: .04em; }
.folder-group-meta { font-size: 12px; color: #888; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.folder-group-count { font-size: 12px; color: #bbb; margin-left: auto; }

/* 标签样式 */
.tag { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 11px; white-space: nowrap; }
.el-水 { background: #dbeafe; color: #1d4ed8; }
.el-木 { background: #dcfce7; color: #166534; }
.el-火 { background: #fee2e2; color: #b91c1c; }
.el-土 { background: #fef9c3; color: #854d0e; }
.el-金 { background: #f3f4f6; color: #374151; }
.wp-card .card-actions { display: flex; gap: 8px; margin-top: 8px; }
.btn-del { padding: 4px 10px; font-size: 11px; background: #fff; border: 1px solid #f0c0c0; color: #c33; border-radius: 4px; cursor: pointer; }
.btn-del:hover { background: #fff5f5; }
.btn-del:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>

<!-- ══════════ 登录 ══════════ -->
<div id="loginSection">
  <div class="login-card">
    <h1>壁纸上传管理</h1>
    <div id="stepEmail">
      <div class="form-row">
        <label>管理员邮箱</label>
        <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email" />
      </div>
      <button class="btn-primary" id="btnSendCode">获取验证码</button>
    </div>
    <div id="stepOtp" style="display:none; margin-top:16px;">
      <div class="form-row">
        <label>验证码</label>
        <input type="text" id="otpInput" placeholder="6 位数字" maxlength="6" inputmode="numeric" />
      </div>
      <button class="btn-primary" id="btnVerify">登录</button>
      <button class="btn-outline" id="btnResend">重新发送</button>
    </div>
    <p class="login-msg" id="loginMsg"></p>
  </div>
</div>

<!-- ══════════ 主区域 ══════════ -->
<div id="mainSection">
  <div class="header">
    <h1>壁纸管理</h1>
    <div class="header-right">
      <span id="adminEmail"></span>
      <button class="btn-sm" id="btnLogout">退出</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="upload">上传</div>
    <div class="tab" data-tab="manage">已上传壁纸</div>
  </div>

  <!-- ── 上传 Tab ── -->
  <div class="tab-content active" id="tab-upload">
    <div class="drop-zone" id="dropZone">
      <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24">
        <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
        <polyline points="16 8 12 4 8 8"/>
        <line x1="12" y1="4" x2="12" y2="16"/>
      </svg>
    <p>将壁纸文件夹拖到此处</p>
    <p class="hint">支持同时拖入多个编号文件夹 · 点击选择仅支持单个文件夹</p>
      <input type="file" id="folderInput" webkitdirectory multiple />
    </div>

    <div id="unknownWrap">
      <strong>以下文件夹编号未在映射表中找到，已跳过：</strong>
      <span id="unknownList"></span>
    </div>

    <div id="queueSection">
      <div class="queue-toolbar">
        <span id="fileCount"></span>
        <button id="btnUpload">开始上传</button>
      </div>
      <div class="folder-groups" id="queueGrid"></div>
    </div>
  </div>

  <!-- ── 管理 Tab ── -->
  <div class="tab-content" id="tab-manage">
    <div class="manage-toolbar">
      <div class="manage-filters" id="filterBar">
      <button class="filter-btn active" data-el="全部">全部</button>
      <button class="filter-btn" data-el="水">水</button>
      <button class="filter-btn" data-el="木">木</button>
      <button class="filter-btn" data-el="火">火</button>
      <button class="filter-btn" data-el="土">土</button>
      <button class="filter-btn" data-el="金">金</button>
      </div>
      <div class="manage-actions">
        <button type="button" class="btn-regen btn-check" id="btnTestPreview">测试生成一张</button>
        <button type="button" class="btn-regen btn-check" id="btnCheckPreviews">检查预览</button>
        <button type="button" class="btn-regen btn-check" id="btnRegenPreviews">补生成（跳过已完成）</button>
        <button type="button" class="btn-regen" id="btnForceRegen">强制全部重新生成</button>
      </div>
    </div>
    <div id="manageEmpty" class="empty-hint">暂无已上传壁纸</div>
    <div class="folder-groups" id="managedGrid"></div>
  </div>
</div>

// ════════════════════════════════════════════
// 登录：Supabase 邮箱验证码 + profiles.is_admin
// ════════════════════════════════════════════
let _otpSent = false;

async function checkAdminByEmail(email) {
  const { data, error } = await sb.rpc('is_admin_email', { check_email: email });
  if (error) {
    console.error('is_admin_email error:', error);
    return { ok: false, reason: '管理员校验失败：' + error.message + '（请确认已执行 is_admin_email SQL）' };
  }
  return data === true
    ? { ok: true }
    : { ok: false, reason: '该邮箱不是管理员' };
}

async function assertAdminSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session?.access_token || !session.user?.email) {
    return { ok: false, reason: '未登录' };
  }
  const { data: profile } = await sb
    .from('profiles')
    .select('is_admin')
    .eq('id', session.user.id)
    .maybeSingle();
  if (profile?.is_admin) {
    return { ok: true, email: session.user.email, token: session.access_token };
  }
  // 兼容：profiles 行尚未写入 is_admin 时，再用 RPC 校验邮箱
  const byEmail = await checkAdminByEmail(session.user.email);
  if (!byEmail.ok) {
    await sb.auth.signOut().catch(() => {});
    return { ok: false, reason: byEmail.reason };
  }
  return { ok: true, email: session.user.email, token: session.access_token };
}

async function getAdminAuthHeaders(extra) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, extra || {});
  const { data: { session } } = await sb.auth.getSession();
  if (!session?.access_token) throw new Error('请先登录');
  headers['Authorization'] = `Bearer ${session.access_token}`;
  return headers;
}

async function checkSession() {
  // 清掉旧版模拟登录残留
  localStorage.removeItem('admin_mock_email');
  const auth = await assertAdminSession();
  if (auth.ok) enterMain(auth.email);
}

function enterMain(email) {
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('mainSection').style.display = 'block';
  document.getElementById('adminEmail').textContent = email;
  loadUploaded();
}

function setMsg(text, ok = false) {
  const el = document.getElementById('loginMsg');
  el.textContent = text;
  el.className = 'login-msg' + (ok ? ' login-ok' : '');
}

document.getElementById('btnSendCode').addEventListener('click', async () => {
  const email = document.getElementById('emailInput').value.trim();
  if (!email) return setMsg('请输入邮箱');
  const btn = document.getElementById('btnSendCode');
  btn.disabled = true;
  setMsg('校验管理员权限中…');
  try {
    const result = await checkAdminByEmail(email);
    if (!result.ok) {
      setMsg(result.reason);
      return;
    }
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { shouldCreateUser: true },
    });
    if (error) throw error;
    _otpSent = true;
    document.getElementById('stepOtp').style.display = '';
    setMsg('验证码已发送，请查收邮箱', true);
  } catch (err) {
    setMsg(err?.message || '发送验证码失败');
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('btnVerify').addEventListener('click', async () => {
  const email = document.getElementById('emailInput').value.trim();
  const token = document.getElementById('otpInput').value.trim();
  if (!email) return setMsg('请输入邮箱');
  if (!_otpSent) return setMsg('请先获取验证码');
  if (!token) return setMsg('请输入验证码');

  document.getElementById('btnVerify').disabled = true;
  setMsg('登录中…');
  try {
    const { error } = await sb.auth.verifyOtp({
      email,
      token,
      type: 'email',
    });
    if (error) throw error;
    const auth = await assertAdminSession();
    if (!auth.ok) {
      setMsg(auth.reason || '该邮箱不是管理员');
      return;
    }
    enterMain(auth.email);
  } catch (err) {
    setMsg(err?.message || '验证码错误或已过期');
  } finally {
    document.getElementById('btnVerify').disabled = false;
  }
});

document.getElementById('btnResend').addEventListener('click', () => document.getElementById('btnSendCode').click());
document.getElementById('btnLogout').addEventListener('click', async () => {

const dropZone    = document.getElementById('dropZone');
const folderInput = document.getElementById('folderInput');
let pendingFiles  = [];

dropZone.addEventListener('click', () => folderInput.click());
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', async e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  // 必须在第一个 await 前同步收集所有 entry，否则浏览器会清空 dataTransfer.items
  const entries = [...e.dataTransfer.items]
    .map(item => item.webkitGetAsEntry?.())
    .filter(Boolean);
  const unknownNums = new Set();
  for (const entry of entries) {
    await processEntry(entry, null, unknownNums);
  }
  showUnknown(unknownNums);
  renderQueue();
});

folderInput.addEventListener('change', () => {
  const unknownNums = new Set();
  for (const file of folderInput.files) {
    if (!isImage(file.name)) continue;
    const parts = file.webkitRelativePath.split('/');
    let folderNum = null;
    if (parts.length >= 3) folderNum = parseInt(parts[parts.length - 2]);
    else if (parts.length === 2) folderNum = parseInt(parts[0]);
    if (isNaN(folderNum)) continue;
    if (!FOLDER_MAP[folderNum]) { unknownNums.add(folderNum); continue; }
    const { element, tags } = FOLDER_MAP[folderNum];
    pendingFiles.push({ file, folderNum, element, tags, status: 'pending', previewUrl: URL.createObjectURL(file) });
  }
  showUnknown(unknownNums);
  renderQueue();
});

async function processEntry(entry, parentNum, unknownNums) {
  if (entry.isFile) {
    if (parentNum !== null && isImage(entry.name)) {
      const file = await entryToFile(entry);
      const { element, tags } = FOLDER_MAP[parentNum];
      pendingFiles.push({ file, folderNum: parentNum, element, tags, status: 'pending', previewUrl: URL.createObjectURL(file) });
    }
  } else if (entry.isDirectory) {
    const num = parseInt(entry.name);
    if (!isNaN(num)) {
      if (!FOLDER_MAP[num]) { unknownNums.add(num); return; }
      const entries = await readAllEntries(entry.createReader());
      for (const e of entries) await processEntry(e, num, unknownNums);
    } else {
      const entries = await readAllEntries(entry.createReader());
      for (const e of entries) await processEntry(e, null, unknownNums);
    }
  }
}

async function readAllEntries(reader) {
  const all = [];
  while (true) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    if (!batch.length) break;
    all.push(...batch);
  }
  return all;
}

function entryToFile(entry) { return new Promise((res, rej) => entry.file(res, rej)); }
function isImage(name) { return /\.(jpe?g|png|webp|gif|avif|heic)$/i.test(name); }

function showUnknown(set) {
  const wrap = document.getElementById('unknownWrap');
  if (!set.size) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  document.getElementById('unknownList').textContent = [...set].sort((a,b)=>a-b).join('、');
}

function renderQueue() {

      : '';
    const cards = items.map(({ f, i }) =>
      `<div class="wp-card" id="qcard-${i}">
        <img class="thumb" src="${f.previewUrl}" alt="${esc(f.file.name)}" loading="lazy" />
        <div class="card-info">
          <div class="card-name" title="${esc(f.file.name)}">${esc(f.file.name)}</div>

            ${f.tags.map(t => `<span class="tag el-tag">${esc(t)}</span>`).join('')}
          </div>

function updateQCard(i) {
  const card = document.getElementById(`qcard-${i}`);
  if (!card) return;
  const f = pendingFiles[i];
  const s = card.querySelector('.card-status');
  s.className = `card-status ${f.status}`;
  s.textContent = STATUS_TEXT[f.status];
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function isSafariBrowser() {
  const ua = navigator.userAgent || '';
  return /Safari/i.test(ua) && !/Chrome|Chromium|Android|Edg/i.test(ua);
}

function loadImageSrc(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('图片解码失败'));
    img.src = src;
  });
}

function asImageBlob(blob, hint) {
  const t = String((blob && blob.type) || '').toLowerCase();
  if (t.indexOf('image/') === 0) return blob;
  const mime = /\.png(\?|$)/i.test(hint || '') ? 'image/png' : 'image/jpeg';
  return new Blob([blob], { type: mime });
}

async function decodeImageBlob(blob, hint) {
  const typed = asImageBlob(blob, hint);
  const kb = Math.max(1, Math.round((typed && typed.size ? typed.size : 0) / 1024));
  const tryBitmap = async () => {
    if (typeof createImageBitmap !== 'function') return null;
    try {
      return await createImageBitmap(typed);
    } catch (_) {
      return null;
    }
  };
  const tryElement = async () => {
    const url = URL.createObjectURL(typed);
    try {
      return await loadImageSrc(url);
    } finally {
      URL.revokeObjectURL(url);
    }
  };

  // Safari 的 createImageBitmap 对 R2 的 octet-stream 经常报 Load failed
  const order = isSafariBrowser() ? [tryElement, tryBitmap] : [tryBitmap, tryElement];
  let lastErr = null;
  for (let i = 0; i < order.length; i++) {
    try {
      const img = await order[i]();
      if (img) return img;
    } catch (err) {
      lastErr = err;
    }
  }
  throw new Error(`图片解码失败（已下载 ${kb}KB${lastErr && lastErr.message ? '，' + lastErr.message : ''}）`);
}

let _watermarkLogoPromise = null;
function getWatermarkLogo() {
  if (!_watermarkLogoPromise) {
    _watermarkLogoPromise = loadImageSrc('assets/lockscreen-watermark.png').catch(() => null);
  }
  return _watermarkLogoPromise;
}

function drawLockscreenWatermark(ctx, width, height, watermark) {
  if (watermark && watermark.width) {
    ctx.drawImage(watermark, 0, 0, width, height);
  }
}

// 生成预览图：长边 1080px，JPEG 质量 0.6，并烧入锁屏水印
async function makePreviewBlob(file) {
  const img = await decodeImageBlob(file, file && file.name);
  try {
    const maxSide = 1080;
    let width = img.width;
    let height = img.height;
    if (width > maxSide || height > maxSide) {
      if (width >= height) {
        height = Math.round(height * maxSide / width);
        width = maxSide;
      } else {
        width = Math.round(width * maxSide / height);
        height = maxSide;
      }
    }
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);
    const watermark = await getWatermarkLogo();
    drawLockscreenWatermark(ctx, width, height, watermark);
    const blob = await new Promise((resolve, reject) => {
      canvas.toBlob(
        (b) => b ? resolve(b) : reject(new Error('预览压缩失败')),
        'image/jpeg',
        0.6
      );
    });
    return blob;
  } finally {
    if (img && typeof img.close === 'function') img.close();
  }
}

function previewFilename(name) {
  const base = String(name).replace(/\.[^.]+$/, '') || 'preview';
  return base + '.jpg';
}

async function presignAndPut({ filename, folder, contentType, body, variant, headers }) {
  const authHeaders = headers || await getAdminAuthHeaders();

  // 预览图走服务端直传（base64），避免浏览器直接 PUT R2 触发 CORS 错误
  if (variant === 'preview') {
    const arrayBuf = await (body instanceof Blob ? body.arrayBuffer() : Promise.resolve(body));
    const bytes = new Uint8Array(arrayBuf);
    // 分块拼接避免 O(n²) 字符串拼接
    let binary = '';
    const CHUNK = 8192;
    for (let i = 0; i < bytes.length; i += CHUNK) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    const bodyBase64 = btoa(binary);
    const res = await fetch('/api/presign', {
      method: 'POST',
      headers: authHeaders,
      body: JSON.stringify({ filename, folder, contentType, variant, bodyBase64 }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `preview upload failed: ${res.status}`);
    }
    const { key } = await res.json();
    return key;
  }

  // 原图：用预签名 URL 直传（绕开 Vercel 4.5MB 限制）
  const presignRes = await fetch('/api/presign', {
    method: 'POST',
    headers: authHeaders,
    body: JSON.stringify({ filename, folder, contentType, variant }),
  });
  if (!presignRes.ok) {
    const err = await presignRes.json().catch(() => ({}));
    throw new Error(err.error || `presign failed: ${presignRes.status}`);
  }
  const { url, key } = await presignRes.json();
  let uploadRes;
  try {
    uploadRes = await fetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': contentType },
      body,
    });
  } catch (err) {
    throw new Error(`R2 上传失败（网络）：${err && err.message ? err.message : err}`);
  }
  if (!uploadRes.ok) throw new Error(`R2 upload failed (${variant || 'original'}): ${uploadRes.status}`);
  return key;
}

// ════════════════════════════════════════════
// 上传（真实 R2）：原图 + 预览图
// ════════════════════════════════════════════
document.getElementById('btnUpload').addEventListener('click', async () => {
  const btn = document.getElementById('btnUpload');
  btn.disabled = true;

  const auth = await assertAdminSession();
  if (!auth.ok) {
    alert('请先登录');
    btn.disabled = false;
    location.reload();
    return;
  }

  for (let i = 0; i < pendingFiles.length; i++) {
    const item = pendingFiles[i];
    if (item.status === 'done') continue;
    item.status = 'uploading';
    updateQCard(i);
    try {
      // 1) 原图
      const r2_key = await presignAndPut({
        filename: item.file.name,
        folder: item.folderNum,
        contentType: item.file.type || 'image/jpeg',
        body: item.file,
      });

      // 2) 压缩预览图（长边 720 / JPEG 0.5，锁屏水印烧进像素）
      const previewBlob = await makePreviewBlob(item.file);
      const previewName = previewFilename(item.file.name);
      const preview_key = await presignAndPut({
        filename: previewName,
        folder: item.folderNum,
        contentType: 'image/jpeg',
        body: previewBlob,
        variant: 'preview',
      });

      // 3) 元数据入库
      const metaRes = await fetch('/api/wallpaper-meta', {
        method: 'POST',
        headers: await getAdminAuthHeaders(),
        body: JSON.stringify({
          folder_number: item.folderNum,
          element:       item.element,
          tags:          item.tags,
          r2_key,
          preview_key,
          filename:      item.file.name,
        }),
      });

      if (!metaRes.ok) {
        const err = await metaRes.json().catch(() => ({}));
        throw new Error(err.error || `meta save failed: ${metaRes.status}`);
      }
      item.status = 'done';
      item.r2_key = r2_key;
      item.preview_key = preview_key;
    } catch (err) {
      console.error(err);
      item.status = 'error';
      item.errorMsg = err.message || String(err);
    }
    updateQCard(i);
  }
  btn.disabled = false;
  const done  = pendingFiles.filter(f => f.status === 'done').length;
  const error = pendingFiles.filter(f => f.status === 'error').length;
  const firstErr = pendingFiles.find(f => f.status === 'error');
  document.getElementById('fileCount').textContent =
    `完成 ${done} 张${error ? `，失败 ${error} 张` : ''}` +
    (firstErr?.errorMsg ? `（${firstErr.errorMsg}）` : '');
  loadUploaded();
});

// 管理面板：加载已上传壁纸（只显示预览图）
// ════════════════════════════════════════════
let allUploaded = [];
let activeFilter = '全部';
let previewBust = '';

function wallpaperDisplayUrl(w) {
  const key = w.preview_key || w.r2_key || '';
  if (!key) return w.preview_url || w.previewUrl || '';
  const url = `${R2_PUBLIC_URL}/${key}`;
  return previewBust ? `${url}?v=${previewBust}` : url;
}

async function loadUploaded() {
  const { data, error } = await sb.from('wallpapers').select('*').order('uploaded_at', { ascending: false });
  if (error || !data) {
    console.error('loadUploaded', error);
    const now = new Date().toLocaleString('zh-CN', { hour12: false });
    allUploaded = pendingFiles
      .filter(f => f.status === 'done')
      .map(f => ({
        filename:      f.file.name,
        folder_number: f.folderNum,
        element:       f.element,
        tags:          f.tags,
        preview_key:   f.preview_key || '',
        r2_key:        f.r2_key || '',
        preview_url:   f.previewUrl,
        uploaded_at:   now,
      }));
  } else {
    allUploaded = data.map(w => ({
      ...w,
      preview_url: wallpaperDisplayUrl(w),
    }));
  }
  renderManaged();
}

function resolveFolderNum(w) {
  if (w.folder_number != null && !isNaN(w.folder_number)) return Number(w.folder_number);
  const key = w.r2_key || w.preview_key || '';
  const m = key.match(/^wallpapers\/(\d+)\//);
  return m ? parseInt(m[1], 10) : null;
}

function wallpaperCardHtml(w) {
  const tags = Array.isArray(w.tags) ? w.tags : [];
  return `<div class="wp-card" data-id="${esc(w.id || '')}">
    <img class="thumb" src="${esc(w.preview_url || w.r2_url || '')}" alt="${esc(w.filename || '')}" loading="lazy" onerror="this.style.display='none'" />
    <div class="card-info">
      <div class="card-name" title="${esc(w.filename || '')}">${esc(w.filename || '')}</div>
      <div class="card-tags">
        <span class="tag el-${esc(w.element)}">${esc(w.element)}</span>
        ${tags.map(t => `<span class="tag el-tag">${esc(t)}</span>`).join('')}
      </div>
      ${w.uploaded_at ? `<div style="font-size:11px;color:#bbb;margin-top:4px;">${esc(w.uploaded_at)}</div>` : ''}
      ${w.id ? `<div class="card-actions"><button type="button" class="btn-del" data-id="${esc(w.id)}">删除</button></div>` : ''}
    </div>
  </div>`;
}

function renderManaged() {
  const grid  = document.getElementById('managedGrid');
  const empty = document.getElementById('manageEmpty');
  const list  = activeFilter === '全部' ? allUploaded : allUploaded.filter(w => w.element === activeFilter);
  if (!list.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // 按文件夹编号分组
  const groups = new Map();
  for (const w of list) {
    const num = resolveFolderNum(w);
    const key = num != null ? num : '未知';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(w);
  }
  const sortedKeys = [...groups.keys()].sort((a, b) => {
    if (a === '未知') return 1;
    if (b === '未知') return -1;
    return a - b;
  });

  grid.innerHTML = sortedKeys.map(key => {
    const items = groups.get(key);
    const meta = typeof key === 'number' ? FOLDER_MAP[key] : null;
    const tagsHtml = meta
      ? `<span class="tag el-${meta.element}">${esc(meta.element)}</span>${meta.tags.map(t => `<span class="tag el-tag">${esc(t)}</span>`).join('')}`
      : (items[0]?.element ? `<span class="tag el-${esc(items[0].element)}">${esc(items[0].element)}</span>` : '');
    const title = key === '未知' ? '未知文件夹' : `文件夹 ${key}`;
    return `<div class="folder-group">
      <div class="folder-group-header">
        <span class="folder-group-title">${title}</span>
        <span class="folder-group-meta">${tagsHtml}</span>
        <span class="folder-group-count">${items.length} 张</span>
      </div>
      <div class="card-grid">${items.map(wallpaperCardHtml).join('')}</div>
    </div>`;
  }).join('');
}

function previewDest(w) {
  const folder = resolveFolderNum(w);
  if (folder == null) throw new Error('无法解析文件夹编号');
  if (w.preview_key) {
    const filename = String(w.preview_key).split('/').pop();
    if (!filename) throw new Error('预览路径无效');
    return { folder, filename, key: w.preview_key, existed: true };
  }
  const filename = previewFilename(w.filename || 'preview.jpg');
  return { folder, filename, key: `wallpapers/${folder}/preview/${filename}`, existed: false };
}

function r2Url(key) {
  return `${R2_PUBLIC_URL}/${String(key).split('/').map(encodeURIComponent).join('/')}`;
}

async function fetchOriginalBlob(r2Key) {
  const url = r2Url(r2Key);
  let res;
  try {
    res = await fetch(url, { mode: 'cors', credentials: 'omit' });
  } catch (err) {
    throw new Error(`原图下载失败（网络/CORS）：${err && err.message ? err.message : err}`);
  }
  if (!res.ok) throw new Error(`原图下载失败 ${res.status}`);
  let blob;
  try {
    blob = await res.blob();
  } catch (err) {
    throw new Error(`原图读取失败：${err && err.message ? err.message : err}`);
  }
  if (!blob || !blob.size) throw new Error('原图为空');
  return asImageBlob(blob, r2Key);
}

async function inspectPreviewStatus(previewKey) {
  if (!previewKey) return { status: 'missing' };
  try {
    const res = await fetch(r2Url(previewKey), {
      mode: 'cors',
      credentials: 'omit',
      cache: 'no-store',
    });
    if (!res.ok) return { status: 'missing' };
    const blob = await res.blob();
    if (!blob || !blob.size) return { status: 'missing' };
    const img = await decodeImageBlob(blob, previewKey);
    const maxSide = Math.max(img.width, img.height);
    if (img && typeof img.close === 'function') img.close();
    return { status: maxSide <= 1080 ? 'baked' : 'old', maxSide };
  } catch (_) {
    return { status: 'missing' };
  }
}

function previewAlreadyBaked(previewKey) {
  return inspectPreviewStatus(previewKey).then((r) => r.status === 'baked');
}

function previewLabel(w) {
  return w.filename || w.preview_key || w.r2_key || w.id;
}

async function scanAllPreviews(list, onProgress) {
  const baked = [];
  const old = [];
  const missing = [];
  let done = 0;
  await mapPool(list, 8, async (w) => {
    let key = w.preview_key;
    if (!key) {
      try { key = previewDest(w).key; } catch (_) { key = ''; }
    }
    const result = await inspectPreviewStatus(key);
    const label = previewLabel(w);
    if (result.status === 'baked') baked.push(label);
    else if (result.status === 'old') old.push(label);
    else missing.push(label);
    done += 1;
    if (onProgress) onProgress(done, list.length, baked.length, old.length, missing.length);
  });
  return { total: list.length, baked, old, missing };
}

function formatPreviewReport(scan) {
  let msg = `共 ${scan.total} 张\n已生成（长边 1080）：${scan.baked.length}\n仍是旧图（大于 1080）：${scan.old.length}\n缺失或打不开：${scan.missing.length}`;
  if (scan.old.length === 0 && scan.missing.length === 0) {
    msg += '\n\n全部预览都已生成。';
    return msg;
  }
  const leftover = scan.old.concat(scan.missing).slice(0, 8);
  if (leftover.length) msg += `\n\n未完成示例：\n${leftover.join('\n')}`;
  return msg;
}

async function mapPool(items, limit, worker, shouldStop) {
  const running = new Set();
  for (const item of items) {
    if (shouldStop && shouldStop()) break;
    const p = Promise.resolve().then(() => worker(item)).finally(() => running.delete(p));
    running.add(p);
    if (running.size >= limit) await Promise.race(running);
  }
  await Promise.all(running);
}


document.getElementById('btnCheckPreviews').addEventListener('click', async () => {
  const btn = document.getElementById('btnCheckPreviews');
  const regenBtn = document.getElementById('btnRegenPreviews');
  if (btn.disabled) return;
  const list = (allUploaded || []).filter((w) => w.id && w.r2_key);
  if (!list.length) {
    alert('没有可检查的壁纸');
    return;
  }
  btn.disabled = true;
  regenBtn.disabled = true;
  try {
    const scan = await scanAllPreviews(list, (done, total, baked, old, missing) => {
      btn.textContent = `正在检查 ${done}/${total}（已生成 ${baked}）…`;
    });
    alert(formatPreviewReport(scan));
  } catch (err) {
    alert(err.message || String(err));
  } finally {
    btn.disabled = false;
    regenBtn.disabled = false;
    btn.textContent = '检查预览';
  }
});

// ════════════════════════════════════════════
// 初始化：恢复 Supabase 会话（并再次校验仍是管理员）
// ════════════════════════════════════════════
async function runRegen(forceAll) {
  const list = (allUploaded || []).filter((w) => w.id && w.r2_key);
  if (!list.length) { alert('没有可生成的壁纸（需要已有原图）'); return; }
  const confirmMsg = forceAll
    ? `将强制覆盖全部 ${list.length} 张预览（不跳过任何图）。确认继续？`
    : `只会补还没生成的预览（已是长边 1080 的会跳过）。共 ${list.length} 张待检查。`;
  if (!confirm(confirmMsg)) return;

  const auth = await assertAdminSession();
  if (!auth.ok) { alert('请先登录'); return; }

  const regenBtn = document.getElementById('btnRegenPreviews');
  const forceBtn = document.getElementById('btnForceRegen');
  regenBtn.disabled = true;
  forceBtn.disabled = true;
  const activeBtn = forceAll ? forceBtn : regenBtn;

  let ok = 0, skipped = 0, fail = 0, done = 0;
  const CONCURRENCY = 4;
  try {
    const headers = await getAdminAuthHeaders();
    await getWatermarkLogo();
    const updateProgress = () => {
      activeBtn.textContent = `正在处理 ${done}/${list.length}（生成 ${ok}${forceAll ? '' : '，跳过 ' + skipped}）…`;
    };
    updateProgress();
    await mapPool(list, CONCURRENCY, async (w) => {
      try {
        const dest = previewDest(w);
        if (!forceAll && await previewAlreadyBaked(w.preview_key || dest.key)) {
          skipped += 1;
          return;
        }
        const original = await fetchOriginalBlob(w.r2_key);
        const previewBlob = await makePreviewBlob(original);
        const key = await presignAndPut({
          filename: dest.filename,
          folder: dest.folder,
          contentType: 'image/jpeg',
          body: previewBlob,
          variant: 'preview',
          headers,
        });
        if (!dest.existed || key !== w.preview_key) {
          const metaRes = await fetch('/api/wallpaper-meta', {
            method: 'POST',
            headers,
            body: JSON.stringify({ action: 'set_preview', id: w.id, preview_key: key }),
          });
          if (!metaRes.ok) {
            const err = await metaRes.json().catch(() => ({}));
            throw new Error(err.error || `写入预览路径失败: ${metaRes.status}`);
          }
        }
        ok += 1;
      } catch (err) {
        fail += 1;
        console.error('regen preview', w.filename || w.r2_key, err.message || err);
      } finally {
        done += 1;
        updateProgress();
      }
    });
  } finally {
    previewBust = String(Date.now());
    regenBtn.disabled = false;
    forceBtn.disabled = false;
    regenBtn.textContent = '补生成（跳过已完成）';
    forceBtn.textContent = '强制全部重新生成';
    await loadUploaded();
  }
  let msg = forceAll ? `已覆盖 ${ok} 张` : `新生成 ${ok} 张，跳过已生成 ${skipped} 张`;
  if (fail) msg += `，失败 ${fail} 张`;
  alert(msg);
}

document.getElementById('btnRegenPreviews').addEventListener('click', () => runRegen(false));
document.getElementById('btnForceRegen').addEventListener('click', () => runRegen(true));

      overlay.classList.remove('show');

    alert('测试失败：' + (err.message || err));
  } finally {
    btn.disabled = false;
    btn.textContent = '测试生成一张';
  }
});
