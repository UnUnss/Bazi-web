<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="nav_download_history">下載記錄 · ElementaWall</title>
    <link rel="preload" href="assets/fonts/cooper-zhengkai/files/CooperZhengKai-1.4.woff2?v=4" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/fonts/cooper-zhengkai/style.css?v=4" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <script src="auth-session.js"></script>
    <script src="i18n.js?v=20"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #2a1e0a;
            --ink-soft: #5a4a28;
            --ink-muted: #8a7a58;
            --line: rgba(42, 30, 10, 0.28);
            --font-kai: "CooperZhengKai", "CooperZhengKaiFull", "Kaiti SC", "Kaiti TC", "STKaiti", "KaiTi", "楷体", "Songti SC", "SimSun", serif;
        }

        html, body {
            font-family: var(--font-kai);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-paper {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: url('assets/bg-paper-opt.jpg') center / cover no-repeat;
            pointer-events: none;
        }

        .disk-wrap {
            position: fixed;
            left: -51.16vw;
            top: 1.92vh;
            width: 145.83vw;
            height: auto;
            z-index: -1;
            pointer-events: none;
        }

        .disk-wrap img {
            display: block;
            width: 100%;
            height: auto;
            animation: spin 90s linear infinite;
            transform-origin: 51.77% 49.9%;
        }

        .disk-wrap .disk-img {
            position: relative;
            mix-blend-mode: darken;
            opacity: 0.15;
        }

        .disk-wrap .dragon-img {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.5;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* ─── 導航 ─── */
        nav {
            position: relative;
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: calc(84px - 2vh) 52px 20px;
            min-height: 22px;
        }

        .nav-logo-wrap {
            position: absolute;
            top: calc(4px - 3vh);
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            pointer-events: none;
        }

        /* 透明热区：只覆盖 logo 文字中心，不撑满整张图 */
        .nav-logo-link {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(260px, 55vw);
            height: 72px;
            pointer-events: auto;
            cursor: pointer;
            z-index: 7;
            display: block;
        }

        .nav-logo-wrap img {
            display: block;
            width: 100%;
            pointer-events: none;
            height: auto;
        }

        .nav-user {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-link-item,
        .lang-switch-btn,
        .btn-login {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 0.06em;
            padding: 6px 16px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: rgba(255, 252, 245, 0.6);
            color: var(--ink);
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-link-item:hover,
        .lang-switch-btn:hover,
        .btn-login:hover {
            background: rgba(255, 252, 245, 0.9);
        }

        .lang-switch-wrap,
        .about-switch-wrap { position: relative; }

        .lang-switch-btn .caret,
        .about-switch-btn .caret {
            font-size: 9px;
            opacity: 0.7;
        }

        .lang-menu,
        .about-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 160px;
            background: rgba(255, 252, 245, 0.96);
            border: 1px solid var(--line);
            border-radius: 2px;
            z-index: 20;
            box-shadow: 0 8px 24px rgba(42, 30, 10, 0.08);
            overflow: hidden;
        }

        .about-menu {
            /* 关于我们靠左：左对齐向右展开，避免英文长文案向左溢出裁切 */
            left: 0;
            right: auto;
            min-width: 130px;
            width: max-content;
            max-width: calc(100vw - 32px);
        }

        .lang-menu.open,
        .about-menu.open { display: block; }

        .lang-menu button,
        .about-menu a {
            display: block;
            width: 100%;
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 0.04em;
            padding: 9px 14px;
            border: none;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            text-align: left;
            border-bottom: 1px solid rgba(42, 30, 10, 0.08);
            white-space: nowrap;
            box-sizing: border-box;
        }

        .lang-menu button:last-child,
        .about-menu a:last-child { border-bottom: none; }
        .lang-menu button:hover,
        .lang-menu button.active,
        .about-menu a:hover { background: rgba(42, 30, 10, 0.05); }
        .about-menu a { text-decoration: none; }

        .auth-area { position: relative; display: flex; align-items: center; }
        .user-menu-wrap { position: relative; }
        .nav-user-icon {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--line); border-radius: 50%;
            background: rgba(255, 252, 245, 0.6);
            cursor: pointer; color: var(--ink);
        }
        .nav-user-icon:hover { background: rgba(255, 252, 245, 0.9); }
        .user-menu {
            display: none; position: absolute; top: calc(100% + 6px); right: 0;
            min-width: 160px; background: rgba(255, 252, 245, 0.96);
            border: 1px solid var(--line); border-radius: 2px;
            z-index: 20; box-shadow: 0 8px 24px rgba(42, 30, 10, 0.08); overflow: hidden;
        }
        .user-menu.open { display: block; }
        .user-menu-email {
            padding: 9px 14px; font-size: 12px; color: var(--ink-soft);
            letter-spacing: 0.02em; border-bottom: 1px solid rgba(42, 30, 10, 0.08);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-menu-email:empty { display: none; }
        .user-menu button {
            display: block; width: 100%; font-family: inherit; font-size: 13px;
            letter-spacing: 0.04em; padding: 9px 14px; border: none;
            background: transparent; color: var(--ink); cursor: pointer;
            text-align: left; border-bottom: 1px solid rgba(42, 30, 10, 0.08);
        }
        .user-menu button:last-child { border-bottom: none; }
        .user-menu button:hover { background: rgba(42, 30, 10, 0.05); }

        /* ─── 內容 ─── */
        .page-content {
            position: relative;
            z-index: 2;
            max-width: 640px;
            margin: 0 auto;
            padding: 40px 32px 80px;
            text-align: center;
        }

        .page-title {
            font-size: 22px;
            letter-spacing: 0.24em;
            color: var(--ink-soft);
            margin-bottom: 32px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 252, 245, 0.72);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 14px 18px;
            text-align: left;
        }

        .history-thumb {
            width: 48px;
            height: 64px;
            object-fit: cover;
            border-radius: 2px;
            flex-shrink: 0;
            background: rgba(42, 30, 10, 0.06);
        }

        .history-info {
            flex: 1;
            min-width: 0;
        }

        .history-name {
            font-size: 14px;
            letter-spacing: 0.08em;
            color: var(--ink);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-date {
            font-size: 11px;
            letter-spacing: 0.06em;
            color: var(--ink-muted);
        }

        .btn-redownload {
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 0.08em;
            padding: 6px 14px;
            background: rgba(255, 252, 245, 0.72);
            border: 1px solid var(--line);
            border-radius: 2px;
            color: var(--ink);
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .btn-redownload:hover:not(:disabled) {
            background: rgba(255, 252, 245, 0.95);
        }

        .btn-redownload:disabled {
            cursor: not-allowed;
            opacity: 0.4;
        }

        .empty-tip {
            font-size: 14px;
            letter-spacing: 0.12em;
            color: var(--ink-muted);
            padding: 48px 0;
            background: rgba(255, 252, 245, 0.72);
            border: 1px solid var(--line);
            border-radius: 4px;
        }

        @media (max-width: 720px) {
            nav {
                padding: 96px 20px 16px;
                justify-content: center;
            }
            .nav-logo-wrap {
                position: absolute;
                top: 0;
                left: -50vw;
                width: 200vw;
                transform: none;
            }
            .disk-wrap {
                left: -116.80vw;
                top: 11.62vh;
                width: 263.65vw;
            }
            .nav-user { gap: 8px; }
            .nav-link-item,
            .lang-switch-btn,
            .btn-login {
                font-size: 12px;
                padding: 5px 10px;
            }
            .page-content { padding: 28px 20px 60px; }
        }
    </style>
</head>
<body>

<div class="bg-paper"></div>
<div class="disk-wrap" aria-hidden="true">
    <img class="disk-img" src="assets/disk.webp" alt="" draggable="false">
    <img class="dragon-img" src="assets/dragon.png" alt="" draggable="false">
</div>

<nav>
    <div class="nav-logo-wrap" aria-hidden="true">
        <img src="assets/english.png" alt="" draggable="false">
    </div>
    <a href="/" class="nav-logo-link" aria-label="ElementaWall 首頁"></a>
    <div class="nav-user">
        <a href="javascript:void(0)" class="nav-link-item" data-i18n="nav_back" onclick="history.length>1?history.back():location.href='/landing'">返回</a>
        <div class="about-switch-wrap" id="aboutSwitchWrap">
            <button type="button" class="nav-link-item about-switch-btn" id="aboutSwitchBtn">
                <span data-i18n="nav_about">關於我們</span><span class="caret">▼</span>
            </button>
            <div class="about-menu" id="aboutMenu" role="menu">
                <a href="/about" data-i18n="nav_about">關於我們</a>
                <a href="/contact" data-i18n="nav_contact">聯絡我們</a>
                <a href="/policy" data-i18n="nav_policy">用戶服務與隱私協議</a>
            </div>
        </div>
        <div class="lang-switch-wrap" id="langSwitchWrap">
            <button type="button" class="lang-switch-btn" id="langSwitchBtn">
                <span id="langSwitchLabel">语言</span><span class="caret">▼</span>
            </button>
            <div class="lang-menu" id="langMenu" role="menu">
                <button type="button" data-lang-option="zh-TW" data-i18n="lang_menu_zh_tw">繁體中文</button>
                <button type="button" data-lang-option="zh-CN" data-i18n="lang_menu_zh_cn">简体中文</button>
                <button type="button" data-lang-option="en" data-i18n="lang_menu_en">English</button>
            </div>
        </div>
        <div class="auth-area" id="authArea">
            <button type="button" class="btn-login" id="btnLogin" data-i18n="nav_login">登入 / 註冊</button>
            <div class="user-menu-wrap" id="userMenuWrap" style="display:none;">
                <div class="nav-user-icon" id="userMenuBtn" aria-label="用戶">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="user-menu" id="userMenu" role="menu">
                    <div class="user-menu-email" id="userMenuEmail"></div>
                    <button type="button" id="btnAnnualService" data-i18n="nav_annual_service" style="display:none;">包年服务</button>
                    <button type="button" id="btnDownloadHistory" data-i18n="nav_download_history">下載記錄</button>
                    <button type="button" id="btnAccount" data-i18n="nav_account">帳號管理</button>
                    <button type="button" id="btnLogout" data-i18n="nav_logout">退出</button>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="page-content">
    <h1 class="page-title" data-i18n="nav_download_history">下載記錄</h1>
    <div class="history-list" id="historyList"></div>
</div>

<script>
(function () {
    function getLang() {
        return (window.I18N && window.I18N.getLanguage()) || localStorage.getItem('ew_lang') || 'zh-TW';
    }
    const t = (k) => window.I18N ? window.I18N.t(k) : k;

    const langSwitchBtn   = document.getElementById('langSwitchBtn');
    const langMenu        = document.getElementById('langMenu');
    const langSwitchLabel = document.getElementById('langSwitchLabel');
    const aboutSwitchBtn  = document.getElementById('aboutSwitchBtn');
    const aboutMenu       = document.getElementById('aboutMenu');

    function updateLangLabel() {
        const lang = getLang();
        langSwitchLabel.textContent = lang === 'zh-TW' ? '語言' : (lang === 'en' ? 'Language' : '语言');
    }
    updateLangLabel();
    document.addEventListener('i18n:change', () => { updateLangLabel(); renderHistory(); });

    langSwitchBtn.addEventListener('click', e => {
        e.stopPropagation();
        aboutMenu.classList.remove('open');
        langMenu.classList.toggle('open');
    });
    langMenu.addEventListener('click', e => {
        const btn = e.target.closest('[data-lang-option]');
        if (!btn) return;
        if (window.I18N) window.I18N.setLanguage(btn.getAttribute('data-lang-option'));
        langMenu.classList.remove('open');
    });
    aboutSwitchBtn.addEventListener('click', e => {
        e.stopPropagation();
        langMenu.classList.remove('open');
        aboutMenu.classList.toggle('open');
    });
    aboutMenu.addEventListener('click', () => { aboutMenu.classList.remove('open'); });
    document.addEventListener('click', () => { langMenu.classList.remove('open'); aboutMenu.classList.remove('open'); });

    const ANNUAL_PLANS_KEY = 'bazi_annual_plans';
    const ANNUAL_ACTIVE_KEY = 'bazi_annual_active';
    const btnLogin = document.getElementById('btnLogin');
    const userMenuWrap = document.getElementById('userMenuWrap');
    const userMenuBtn = document.getElementById('userMenuBtn');
    const userMenu = document.getElementById('userMenu');
    const userMenuEmail = document.getElementById('userMenuEmail');
    const btnAnnualService = document.getElementById('btnAnnualService');
    function isAnnualActive() {
        try {
            const raw = JSON.parse(localStorage.getItem(ANNUAL_PLANS_KEY) || 'null');
            if (Array.isArray(raw) && raw.length > 0) return true;
        } catch (_) {}
        return localStorage.getItem(ANNUAL_ACTIVE_KEY) === '1';
    }
    function updateAuthUI(logged, email) {
        btnLogin.style.display = logged ? 'none' : '';
        userMenuWrap.style.display = logged ? '' : 'none';
        userMenuEmail.textContent = logged ? (email || '') : '';
        if (btnAnnualService) {
            btnAnnualService.style.display = (logged && isAnnualActive()) ? '' : 'none';
        }
    }
    window.BaziAuth.syncFromSupabase().then(({ loggedIn, email }) => updateAuthUI(loggedIn, email));
    document.addEventListener('i18n:change', () => { updateLangLabel(); renderHistory(); });
    btnLogin.addEventListener('click', () => { location.href = '/landing?login=1'; });
    userMenuBtn.addEventListener('click', e => { e.stopPropagation(); userMenu.classList.toggle('open'); });
    if (btnAnnualService) {
        btnAnnualService.addEventListener('click', (e) => {
            e.stopPropagation();
            location.href = '/landing#annual';
        });
    }
    document.getElementById('btnDownloadHistory').addEventListener('click', () => { location.href = '/download-history'; });
    document.getElementById('btnAccount').addEventListener('click', () => {
        alert(window.I18N ? window.I18N.t('mock_feature_notice') : '此功能即將推出');
        userMenu.classList.remove('open');
    });
    document.getElementById('btnLogout').addEventListener('click', async () => {
        await window.BaziAuth.signOut();
        window.location.href = '/';
        return;
    });
    document.addEventListener('click', () => { userMenu.classList.remove('open'); });

    // 取今日节气月干支（依赖 lunar-javascript）
    function getCurrentMonthGanZhi() {
        try {
            const now = new Date();
            const ec = Solar.fromYmdHms(
                now.getFullYear(), now.getMonth() + 1, now.getDate(),
                now.getHours(), now.getMinutes(), now.getSeconds()
            ).getLunar().getEightChar();
            return ec.getMonthGan() + ec.getMonthZhi();
        } catch (_) { return ''; }
    }

    const _sb = (() => {
        try {
            return supabase.createClient(
                'https://yyiecrsibflscgjxmvbn.supabase.co',
                'sb_publishable_v-LV28YijQFfr2wAHFajmw_GkfU9u1A'
            );
        } catch (_) { return null; }
    })();

    // 清理旧版本地下载记录缓存（现已只读云端）
    try { localStorage.removeItem('ew_download_history'); } catch (_) {}

    // 获取 Supabase access_token
    async function getAccessToken() {
        try {
            if (!_sb) return null;
            const { data: { session } } = await _sb.auth.getSession();
            return session?.access_token || null;
        } catch (_) { return null; }
    }

    async function loadDownloadRecordsFromCloud() {
        if (!_sb) return [];
        const { data: { session } } = await _sb.auth.getSession();
        const user = session?.user;
        if (!user?.id) return null; // null = 未登录
        const { data, error } = await _sb
            .from('download_records')
            .select('r2_key, preview_url, wallpaper_name, month_ganzhi, created_at')
            .eq('user_id', user.id)
            .order('created_at', { ascending: false })
            .limit(200);
        if (error) {
            console.warn('download history cloud load failed', error);
            throw error;
        }
        return (data || []).map((r) => ({
            r2key: r.r2_key,
            img: r.preview_url || '',
            name: r.wallpaper_name || '',
            date: String(r.created_at || '').slice(0, 19).replace('T', ' '),
            monthGanZhi: r.month_ganzhi || '',
        }));
    }

    async function doRedownload(btn, r2key, name) {
        if (btn.disabled) return;
        btn.disabled = true;
        const origText = btn.textContent;
        btn.textContent = '…';
        try {
            const token = await getAccessToken();
            if (!token) {
                alert(window.I18N ? window.I18N.t('nav_login') : '請先登入');
                location.href = '/landing?login=1';
                return;
            }
            const res = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ r2_key: r2key, filename: name }),
            });
            if (res.status === 401) { location.href = '/landing?login=1'; return; }
            if (res.status === 402) {
                alert(window.I18N ? window.I18N.t('download_payment_required') : '需要先購買此壁紙');
                return;
            }
            if (!res.ok) {
                alert(window.I18N ? window.I18N.t('download_failed') : '下載失敗，請稍後重試');
                return;
            }
            const data = await res.json();
            const fileUrl = data.url;
            if (!fileUrl) { alert(window.I18N ? window.I18N.t('download_failed') : '下載失敗'); return; }

            const baseName = (name || 'wallpaper').replace(/[\\/:*?"<>|]+/g, '_');
            try {
                const resp = await fetch(fileUrl, { mode: 'cors', credentials: 'omit' });
                if (!resp.ok) throw new Error('cors fetch failed');
                const blob = await resp.blob();
                const ext = blob.type.includes('png') ? '.png' : blob.type.includes('webp') ? '.webp' : '.jpg';
                const obj = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = obj; a.download = baseName + ext;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(obj), 2000);
            } catch (_) {
                // CORS 失败回退直链（签名 URL 已带 attachment）
                const a = document.createElement('a');
                a.href = fileUrl; a.download = baseName + '.jpg';
                a.rel = 'noopener';
                document.body.appendChild(a); a.click(); a.remove();
            }
        } finally {
            btn.textContent = origText;
            btn.disabled = false;
        }
    }

    async function renderHistory() {
        const list = document.getElementById('historyList');
        const tip = (map) => map[getLang()] || map['zh-TW'];
        list.innerHTML = `<div class="empty-tip">${tip({ 'zh-TW': '載入中…', 'zh-CN': '加载中…', 'en': 'Loading…' })}</div>`;

        let records = [];
        try {
            const loaded = await loadDownloadRecordsFromCloud();
            if (loaded === null) {
                list.innerHTML = `<div class="empty-tip">${tip({ 'zh-TW': '請先登入查看下載記錄', 'zh-CN': '请先登录查看下载记录', 'en': 'Please sign in to view download history' })}</div>`;
                return;
            }
            records = loaded;
        } catch (_) {
            list.innerHTML = `<div class="empty-tip">${tip({ 'zh-TW': '載入失敗，請稍後重試', 'zh-CN': '加载失败，请稍后重试', 'en': 'Failed to load. Please try again.' })}</div>`;
            return;
        }

        if (!records.length) {
            list.innerHTML = `<div class="empty-tip">${tip({ 'zh-TW': '尚無下載記錄', 'zh-CN': '暂无下载记录', 'en': 'No download history yet' })}</div>`;
            return;
        }

        const currentMonth = getCurrentMonthGanZhi();
        const labelMap = {
            redownload:  { 'zh-TW': '重新下載', 'zh-CN': '重新下载', 'en': 'Re-download' },
            expired:     { 'zh-TW': '已過期',   'zh-CN': '已过期',   'en': 'Expired' },
        };
        const lang = getLang();

        // 云端已按 created_at desc，直接渲染
        list.innerHTML = records.map((r) => {
            const isActive = currentMonth && r.monthGanZhi && r.monthGanZhi === currentMonth;
            // 旧记录没有 monthGanZhi，保守处理：允许重新下载
            const canDownload = !r.monthGanZhi || isActive;
            const btnLabel = canDownload ? (labelMap.redownload[lang] || '重新下載') : (labelMap.expired[lang] || '已過期');
            const btnStyle = canDownload ? '' : 'opacity:0.4;cursor:not-allowed;';
            return `
            <div class="history-item">
                <img class="history-thumb" src="${r.img || ''}" alt="${r.name || ''}" onerror="this.style.display='none'">
                <div class="history-info">
                    <div class="history-name">${r.name || '—'}</div>
                    <div class="history-date">${r.date || ''}</div>
                </div>
                <button type="button" class="btn-redownload"
                    data-r2key="${r.r2key || ''}"
                    data-name="${r.name || ''}"
                    data-can="${canDownload ? '1' : '0'}"
                    style="${btnStyle}"
                    ${canDownload ? '' : 'disabled'}
                >${btnLabel}</button>
            </div>`;
        }).join('');

        if (!list._redownloadBound) {
            list._redownloadBound = true;
            list.addEventListener('click', e => {
                const btn = e.target.closest('.btn-redownload');
                if (!btn || btn.dataset.can !== '1') return;
                const r2key = btn.getAttribute('data-r2key');
                const name = btn.getAttribute('data-name');
                if (!r2key) return;
                doRedownload(btn, r2key, name);
            });
        }
    }

    renderHistory();
})();
</script>
</body>
</html>
