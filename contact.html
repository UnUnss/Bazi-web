<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F1ECDF">
    <title data-i18n="nav_contact">聯絡我們 · ElementaWall</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="preload" href="assets/fonts/cooper-zhengkai/files/CooperZhengKai-1.4.woff2?v=12" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/fonts/cooper-zhengkai/style.css?v=12" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="auth-session.js"></script>
    <script src="i18n.js?v=51"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #2a1e0a;
            --ink-soft: #5a4a28;
            --ink-muted: #8a7a58;
            --line: rgba(42, 30, 10, 0.28);
            --font-kai: "CooperZhengKai", "CooperZhengKaiFull", "Kaiti SC", "Kaiti TC", "STKaiti", "KaiTi", "楷体", "Songti SC", "SimSun", serif;
        }

        html, body {
            font-family: var(--font-kai);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        html {
            background-color: #F1ECDF;
        }

        .bg-paper {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: url('assets/bg-paper-opt.jpg') center / cover no-repeat;
            pointer-events: none;
        }

        .disk-wrap {
            position: fixed;
            left: -51.16vw;
            top: 1.92vh;
            width: 145.83vw;
            height: auto;
            z-index: -1;
            pointer-events: none;
        }

        .disk-wrap img {
            display: block;
            width: 100%;
            height: auto;
            animation: spin 90s linear infinite;
            transform-origin: 51.77% 49.9%;
        }

        .disk-wrap .disk-img {
            position: relative;
            mix-blend-mode: darken;
            opacity: 0.15;
        }

        .disk-wrap .dragon-img {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.5;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* ─── 導航 ─── */
        nav {
            position: relative;
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: calc(84px - 2vh) 52px 20px;
            min-height: 22px;
        }

        .nav-logo-wrap {
            position: absolute;
            top: calc(4px - 3vh);
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            pointer-events: none;
        }

        /* 透明热区：只覆盖 logo 文字中心，不撑满整张图 */
        .nav-logo-link {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(260px, 55vw);
            height: 72px;
            pointer-events: auto;
            cursor: pointer;
            z-index: 7;
            display: block;
        }

        .nav-logo-wrap img {
            display: block;
            width: 100%;
            pointer-events: none;
            height: auto;
        }

        .nav-user {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-link-item,
        .lang-switch-btn,
        .btn-login {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 0.06em;
            padding: 6px 16px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: rgba(255, 252, 245, 0.6);
            color: var(--ink);
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-link-item:hover,
        .lang-switch-btn:hover,
        .btn-login:hover {
            background: rgba(255, 252, 245, 0.9);
        }

        .lang-switch-wrap,
        .about-switch-wrap { position: relative; }

        .lang-switch-btn .caret,
        .about-switch-btn .caret {
            font-size: 9px;
            opacity: 0.7;
        }

        .lang-menu,
        .about-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 160px;
            background: rgba(255, 252, 245, 0.96);
            border: 1px solid var(--line);
            border-radius: 2px;
            z-index: 20;
            box-shadow: 0 8px 24px rgba(42, 30, 10, 0.08);
            overflow: hidden;
        }

        .about-menu {
            /* 关于我们靠左：左对齐向右展开，避免英文长文案向左溢出裁切 */
            left: 0;
            right: auto;
            min-width: 130px;
            width: max-content;
            max-width: calc(100vw - 32px);
        }

        .lang-menu.open,
        .about-menu.open { display: block; }

        .lang-menu button,
        .about-menu a {
            display: block;
            width: 100%;
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 0.04em;
            padding: 9px 14px;
            border: none;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            text-align: left;
            border-bottom: 1px solid rgba(42, 30, 10, 0.08);
            white-space: nowrap;
            box-sizing: border-box;
        }

        .lang-menu button:last-child,
        .about-menu a:last-child { border-bottom: none; }
        .lang-menu button:hover,
        .lang-menu button.active,
        .about-menu a:hover { background: rgba(42, 30, 10, 0.05); }
        .about-menu a { text-decoration: none; }

        .auth-area { position: relative; display: flex; align-items: center; }
        .user-menu-wrap { position: relative; }
        .nav-user-icon {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--line); border-radius: 50%;
            background: rgba(255, 252, 245, 0.6);
            cursor: pointer; color: var(--ink);
        }
        .nav-user-icon:hover { background: rgba(255, 252, 245, 0.9); }
        .user-menu {
            display: none; position: absolute; top: calc(100% + 6px); right: 0;
            min-width: 160px; background: rgba(255, 252, 245, 0.96);
            border: 1px solid var(--line); border-radius: 2px;
            z-index: 20; box-shadow: 0 8px 24px rgba(42, 30, 10, 0.08); overflow: hidden;
        }
        .user-menu.open { display: block; }
        .user-menu-email {
            padding: 9px 14px; font-size: 12px; color: var(--ink-soft);
            letter-spacing: 0.02em; border-bottom: 1px solid rgba(42, 30, 10, 0.08);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-menu-email:empty { display: none; }
        .user-menu button {
            display: block; width: 100%; font-family: inherit; font-size: 13px;
            letter-spacing: 0.04em; padding: 9px 14px; border: none;
            background: transparent; color: var(--ink); cursor: pointer;
            text-align: left; border-bottom: 1px solid rgba(42, 30, 10, 0.08);
        }
        .user-menu button:last-child { border-bottom: none; }
        .user-menu button:hover { background: rgba(42, 30, 10, 0.05); }

        /* ─── 內容 ─── */
        .page-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 32px 80px;
            text-align: center;
        }

        .page-title {
            font-size: 22px;
            letter-spacing: 0.24em;
            color: var(--ink-soft);
            margin-bottom: 40px;
        }

        .contact-card {
            background: rgba(255, 252, 245, 0.72);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 36px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .contact-label {
            font-size: 12px;
            letter-spacing: 0.18em;
            color: var(--ink-muted);
        }

        .contact-value {
            font-size: 15px;
            letter-spacing: 0.08em;
            color: var(--ink);
        }

        .contact-value a {
            color: var(--ink);
            text-decoration: none;
        }

        .contact-value a:hover {
            text-decoration: underline;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--line);
            opacity: 0.5;
        }

        /* ─── 社交账号 ─── */
        .social-list {
            display: inline-flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .social-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .social-platform {
            font-size: 12px;
            letter-spacing: 0.12em;
            color: var(--ink-muted);
            width: 4.5em;
            flex-shrink: 0;
        }

        .social-handle {
            font-size: 14px;
            letter-spacing: 0.06em;
            color: var(--ink);
        }

        .copy-btn {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: transparent;
            color: var(--ink-muted);
            cursor: pointer;
            font-family: inherit;
            padding: 0;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .copy-btn:hover {
            background: rgba(42, 30, 10, 0.06);
            color: var(--ink);
            border-color: rgba(42, 30, 10, 0.45);
        }

        .copy-btn.copied {
            color: #2a7a4a;
            border-color: #2a7a4a;
        }

        .copy-btn svg {
            width: 8px;
            height: 8px;
        }

        .social-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        @media (max-width: 720px) {
            nav {
                padding: 96px 20px 16px;
                justify-content: center;
            }
            .nav-logo-wrap {
                position: absolute;
                top: 0;
                left: -50vw;
                width: 200vw;
                transform: none;
            }
            .disk-wrap {
                left: -116.80vw;
                top: 11.62vh;
                width: 263.65vw;
            }
            .nav-user { gap: 8px; }
            .nav-link-item,
            .lang-switch-btn,
            .btn-login {
                font-size: 12px;
                padding: 5px 10px;
            }
            .page-content { padding: 28px 20px 60px; }
            .contact-card { padding: 28px 24px; }
        }
    </style>
</head>
<body>

<div class="bg-paper"></div>
<div class="disk-wrap" aria-hidden="true">
    <img class="disk-img" alt="" draggable="false">

</div>
<script src="obf-disk.js?v=1"></script>

<nav>

        <div class="about-switch-wrap" id="aboutSwitchWrap">

            <div class="about-menu" id="aboutMenu" role="menu">
                <a href="/about" data-i18n="nav_about">關於我們</a>
                <a href="/help" data-i18n="nav_help">使用幫助</a>
                <a href="/contact" data-i18n="nav_contact">聯絡我們</a>
                <a href="/policy" data-i18n="nav_policy">用戶服務與隱私協議</a>
            </div>
        </div>
        <div class="lang-switch-wrap" id="langSwitchWrap">
            <button type="button" class="lang-switch-btn" id="langSwitchBtn">
                <span id="langSwitchLabel">语言</span><span class="caret">▼</span>
            </button>
            <div class="lang-menu" id="langMenu" role="menu">
                <button type="button" data-lang-option="zh-TW" data-i18n="lang_menu_zh_tw">繁體中文</button>
                <button type="button" data-lang-option="zh-CN" data-i18n="lang_menu_zh_cn">简体中文</button>
                <button type="button" data-lang-option="en" data-i18n="lang_menu_en">English</button>
            </div>
        </div>
        <div class="auth-area" id="authArea">
            <button type="button" class="btn-login" id="btnLogin" data-i18n="nav_login">登入 / 註冊</button>
            <div class="user-menu-wrap" id="userMenuWrap" style="display:none;">
                <div class="nav-user-icon" id="userMenuBtn" aria-label="用戶">

                    <button type="button" id="btnDownloadHistory" data-i18n="nav_download_history">下載記錄</button>
                    <button type="button" id="btnAccount" data-i18n="nav_account">帳號管理</button>
                    <button type="button" id="btnLogout" data-i18n="nav_logout">退出</button>
                </div>
            </div>
        </div>
    </div>
</nav>

<script>
(function () {
    function getLang() {
        return (window.I18N && window.I18N.getLanguage()) || localStorage.getItem('ew_lang') || 'zh-TW';
    }

    const langSwitchBtn   = document.getElementById('langSwitchBtn');
    const langMenu        = document.getElementById('langMenu');
    const langSwitchLabel = document.getElementById('langSwitchLabel');
    const aboutSwitchBtn  = document.getElementById('aboutSwitchBtn');
    const aboutMenu       = document.getElementById('aboutMenu');

    function updateLangLabel() {
        const lang = getLang();
        langSwitchLabel.textContent = lang === 'zh-TW' ? '語言' : (lang === 'en' ? 'Language' : '语言');
    }
    updateLangLabel();
    document.addEventListener('i18n:change', updateLangLabel);

    langSwitchBtn.addEventListener('click', e => {
        e.stopPropagation();
        aboutMenu.classList.remove('open');
        langMenu.classList.toggle('open');
    });
    langMenu.addEventListener('click', e => {
        const btn = e.target.closest('[data-lang-option]');
        if (!btn) return;
        if (window.I18N) window.I18N.setLanguage(btn.getAttribute('data-lang-option'));
        langMenu.classList.remove('open');
    });
    aboutSwitchBtn.addEventListener('click', e => {
        e.stopPropagation();
        langMenu.classList.remove('open');
        aboutMenu.classList.toggle('open');
    });
    aboutMenu.addEventListener('click', () => { aboutMenu.classList.remove('open'); });
    document.addEventListener('click', () => { langMenu.classList.remove('open'); aboutMenu.classList.remove('open'); });
})();

(function () {
    const ANNUAL_PLANS_KEY = 'bazi_annual_plans';
    const ANNUAL_ACTIVE_KEY = 'bazi_annual_active';
    const btnLogin = document.getElementById('btnLogin');
    const userMenuWrap = document.getElementById('userMenuWrap');
    const userMenuBtn = document.getElementById('userMenuBtn');
    const userMenu = document.getElementById('userMenu');
    const userMenuEmail = document.getElementById('userMenuEmail');
    const btnAnnualService = document.getElementById('btnAnnualService');

    function isAnnualActive() {
        try {
            const raw = JSON.parse(localStorage.getItem(ANNUAL_PLANS_KEY) || 'null');
            if (Array.isArray(raw) && raw.length > 0) return true;
        } catch (_) {}
        return localStorage.getItem(ANNUAL_ACTIVE_KEY) === '1';
    }
    function updateAuthUI(logged, email) {
        btnLogin.style.display = logged ? 'none' : '';
        userMenuWrap.style.display = logged ? '' : 'none';
        userMenuEmail.textContent = logged ? (email || '') : '';
        if (btnAnnualService) {
            btnAnnualService.style.display = logged ? '' : 'none';
        }
    }
    window.BaziAuth.syncFromSupabase().then(({ loggedIn, email }) => updateAuthUI(loggedIn, email));
    btnLogin.addEventListener('click', () => { location.href = '/landing?login=1'; });
    userMenuBtn.addEventListener('click', e => { e.stopPropagation(); userMenu.classList.toggle('open'); });
    if (btnAnnualService) {
        btnAnnualService.addEventListener('click', (e) => {
            e.stopPropagation();
            location.href = '/landing#annual';
        });
    }
    document.getElementById('btnInviteReward')?.addEventListener('click', () => {
        userMenu.classList.remove('open');
        location.href = '/landing?invite=1';
    });
    document.getElementById('btnDownloadHistory').addEventListener('click', () => { location.href = '/download-history'; });
    document.getElementById('btnAccount').addEventListener('click', () => {
        userMenu.classList.remove('open');
        location.href = '/landing?account=1';
    });
    document.getElementById('btnLogout').addEventListener('click', async () => {
        await window.BaziAuth.signOut();
        window.location.href = '/';
    });
    document.addEventListener('click', () => { userMenu.classList.remove('open'); });
})();

// 复制按钮
document.querySelectorAll('.copy-btn[data-copy]').forEach((btn) => {
    btn.addEventListener('click', async () => {
        const text = btn.getAttribute('data-copy');
        try {
            await navigator.clipboard.writeText(text);
        } catch (_) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }
        const t = window.I18N ? window.I18N.t : (k) => k;
        btn.classList.add('copied');
        btn.setAttribute('aria-label', t('contact_copied'));
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><polyline points="20 6 9 17 4 12"/></svg>`;
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.setAttribute('aria-label', t('contact_copy_aria'));
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
        }, 2000);
    });
});
</script>
